name: Refresh Medium posts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-medium-feed.mjs
      - name: Commit refreshed feed
        run: |
          git diff --quiet -- data/medium-posts.json || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/medium-posts.json
            git commit -m "chore: refresh Medium posts"
            git push
          }
